name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # A tool's repo asks for a deploy when it changes (its .github/workflows/deploy-site.yml).
  repository_dispatch:
    types: [tool-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tools live in their own repos; each is served from its folder under /tools/.
      - uses: actions/checkout@v7
        with:
          repository: ivogomes/fin
          path: tools/finance
      - uses: actions/checkout@v7
        with:
          repository: ivogomes/tapscore
          path: tools/tapscore
      - uses: actions/checkout@v7
        with:
          repository: ivogomes/teleprompter
          path: tools/teleprompter
      - uses: actions/checkout@v7
        with:
          repository: ivogomes/tmx-editor
          path: tools/tmx-editor

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Prepare site (exclude node_modules and dev files)
        run: |
          mkdir _site
          rsync -a \
            --exclude=node_modules/ \
            --exclude=.git/ \
            --exclude=.github/ \
            --exclude=_site/ \
            --exclude=tools/tapscore/app/ \
            --exclude=tools/tapscore/watch/ \
            --exclude=tools/tapscore/wear/ \
            . _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
