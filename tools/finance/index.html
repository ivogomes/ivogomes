<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fin · Take care of your Finances</title>
<meta name="description" content="Fin: take care of your finances. Accounts, transactions, investments and insights.">
<meta name="theme-color" content="#A4D5CF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B3836" media="(prefers-color-scheme: dark)">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/tools.css">
<link rel="stylesheet" href="finance.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin">
</head>
<body>

<header class="tool-header">
  <h1 class="tool-logo">
    <svg class="tool-logo-mark" viewBox="0 0 24 24" aria-hidden="true">
  <rect width="24" height="24" fill="currentColor"/>
  <path d="M6 18Q9 7 16.5 4.5Q13.5 9 15.3 18Z" fill="var(--mark-ground)"/>
  <path d="M3 17q1.5-1.6 3 0t3 0t3 0t3 0t3 0t3 0V19.5H3Z" fill="var(--tool-teal)"/>
</svg>
    <span class="tool-logo-text">Fin</span>
    <span class="fin-tagline">Take care of your Finances</span>
  </h1>
  <span id="sync" class="fin-sync" role="status" hidden></span>
  <nav aria-label="Sections" class="fin-nav">
    <a class="fin-btn secondary" data-nav="overview" href="./" hidden>Overview</a>
    <a class="fin-btn secondary" data-nav="accounts" href="./?account=" hidden>Accounts</a>
    <a class="fin-btn secondary" data-nav="assets" href="./?page=assets" hidden>Assets</a>
    <a class="fin-btn secondary" data-nav="search" href="./?page=search" hidden>Search</a>
    <a class="fin-btn secondary" data-nav="scheduled" href="./?page=scheduled" hidden>Scheduled</a>
    <a class="fin-btn secondary" data-nav="insights" href="./?page=insights" hidden>Insights</a>
    <a class="fin-btn secondary" data-nav="ious" href="./?page=ious" hidden>IOUs</a>
  </nav>
  <button type="button" id="cmd-open" class="fin-cmd-open" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K" title="Go to anything (Ctrl+K)" hidden>
    <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="m15.5 15.5 5 5"/></svg>
    <span class="fin-cmd-open-label">Go to…</span>
    <kbd class="fin-cmd-open-key" aria-hidden="true">Ctrl K</kbd>
  </button>
  <button type="button" id="hide-amounts" class="fin-hide-toggle" aria-pressed="false" aria-label="Hide amounts" title="Hide amounts (Alt+H)" hidden>
    <svg class="fin-icon fin-eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
    <svg class="fin-icon fin-eye-shut" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16"/><path d="M9.9 5.8A9.7 9.7 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.9 3.7M6.6 7.3A16.6 16.6 0 0 0 2.5 12S6 18.5 12 18.5a9.4 9.4 0 0 0 4.4-1.1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </button>
  <div id="me" class="fin-me" hidden>
    <button type="button" id="me-btn" class="fin-me-btn" aria-expanded="false" aria-controls="me-menu" aria-label="Your account"></button>
    <div id="me-menu" class="fin-me-menu" role="group" aria-label="Your account" hidden></div>
  </div>
</header>

<div class="fin-layout">
  <button type="button" id="side-toggle" class="fin-side-toggle" aria-expanded="false" aria-controls="side" hidden>Accounts</button>
  <aside id="side" class="fin-side" aria-label="Accounts" hidden></aside>
  <main id="app" class="fin-main"></main>
</div>

<dialog id="account-dialog" class="fin-dialog" aria-labelledby="account-dialog-h"></dialog>
<dialog id="tx-dialog" class="fin-dialog fin-dialog-wide" aria-labelledby="tx-dialog-h"></dialog>
<dialog id="cmd-dialog" class="fin-dialog fin-cmd" aria-label="Go to"></dialog>

<!-- Phones: the sections as a bar along the bottom, in reach of a thumb (the header tabs are hidden). -->
<nav id="tabbar" class="fin-tabbar" aria-label="Sections" hidden>
  <a data-nav="overview" href="./" hidden>
    <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg>
    <span>Overview</span></a>
  <a data-nav="accounts" href="./?account=" hidden>
    <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
    <span>Accounts</span></a>
  <a data-nav="search" href="./?page=search" hidden>
    <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Z"/><path d="m15.5 15.5 5 5"/></svg>
    <span>Search</span></a>
  <a data-nav="insights" href="./?page=insights" hidden>
    <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M10 20V5M15 20v-6M20 20V8"/></svg>
    <span>Insights</span></a>
  <div class="fin-more">
    <button type="button" id="more-btn" class="fin-more-btn" aria-expanded="false" aria-controls="more-menu">
      <svg class="fin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></svg>
      <span>More</span></button>
    <div id="more-menu" class="fin-more-menu" role="group" aria-label="More sections" hidden>
      <a class="fin-me-item" data-nav="assets" href="./?page=assets" hidden>Assets</a>
      <a class="fin-me-item" data-nav="scheduled" href="./?page=scheduled" hidden>Scheduled</a>
      <a class="fin-me-item" data-nav="ious" href="./?page=ious" hidden>IOUs</a>
    </div>
  </div>
</nav>

<p id="status" class="fin-sr" role="status" aria-live="polite"></p>
<div id="toast" class="fin-toast" role="status" hidden></div>
<button type="button" id="fab" class="fin-fab" aria-label="Add transactions" hidden>+</button>

<script type="module" src="app.js"></script>
</body>
</html>
