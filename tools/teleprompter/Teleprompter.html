document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

heme tokens (default) --- */\n\n  /* Background */\n  --ds-background-default: rgb(255, 255, 255);\n  --ds-background-alternate: rgb(246, 249, 250);\n\n  /* Brand (Dashlane teal/green) */\n  --ds-brand-base: rgb(12, 125, 140);      /* primary teal */\n  --ds-brand-dark: rgb(2, 98, 114);\n  --ds-brand-light: rgb(50, 169, 178);\n  --ds-brand-catchy-idle: rgb(12, 125, 140);\n  --ds-brand-catchy-hover: rgb(20, 105, 118);\n  --ds-brand-catchy-active: rgb(23, 68, 75);\n  --ds-brand-quiet-idle: rgba(50, 169, 178, 0.2);\n  --ds-brand-quiet-hover: rgba(50, 169, 178, 0.34);\n  --ds-brand-quiet-active: rgba(50, 169, 178, 0.5);\n\n  /* Text */\n  --ds-text-neutral-catchy: rgb(33, 37, 41);\n  --ds-text-neutral-standard: rgba(42, 49, 56, 0.92);\n  --ds-text-neutral-quiet: rgba(74, 91, 105, 0.87);\n  --ds-text-inverse-catchy: rgb(255, 255, 255);\n  --ds-text-inverse-standard: rgb(241, 244, 246);\n  --ds-text-inverse-quiet: rgba(150, 167, 176, 0.95);\n  --ds-text-brand-standard: rgb(2, 98, 114);\n  --ds-text-brand-quiet: rgb(12, 125, 140);\n  --ds-text-danger-standard: rgb(173, 28, 33);\n  --ds-text-danger-quiet: rgb(217, 50, 72);\n  --ds-text-positive-standard: rgb(27, 100, 78);\n  --ds-text-positive-quiet: rgb(5, 128, 99);\n  --ds-text-warning-standard: rgb(150, 60, 34);\n  --ds-text-warning-quiet: rgb(178, 87, 41);\n  --ds-text-disabled: rgba(129, 145, 158, 0.7);\n\n  /* Containers — neutral */\n  --ds-container-neutral-quiet: rgb(246, 249, 250);\n  --ds-container-neutral-standard: rgb(240, 244, 245);\n  --ds-container-neutral-supershy: rgb(255, 255, 255);\n  --ds-container-inverse-standard: rgb(42, 49, 56);\n\n  /* Containers — expressive (catchy = filled) */\n  --ds-container-danger-catchy: rgb(217, 50, 72);\n  --ds-container-danger-quiet: rgba(255, 115, 133, 0.2);\n  --ds-container-positive-catchy: rgb(5, 128, 99);\n  --ds-container-positive-quiet: rgba(63, 186, 149, 0.2);\n  --ds-container-warning-catchy: rgb(178, 87, 41);\n  --ds-container-warning-quiet: rgba(237, 137, 45, 0.2);\n  --ds-container-neutral-catchy: rgb(98, 114, 128);\n\n  /* Containers — decorative */\n  --ds-decorative-black: rgb(52, 67, 80);\n  --ds-decorative-blue: rgb(64, 172, 255);\n  --ds-decorative-green: rgb(63, 186, 149);\n  --ds-decorative-grey: rgb(150, 167, 176);\n  --ds-decorative-orange: rgb(237, 137, 45);\n  --ds-decorative-purple: rgb(193, 142, 250);\n  --ds-decorative-red: rgb(255, 115, 133);\n  --ds-decorative-yellow: rgb(209, 158, 27);\n\n  /* Borders */\n  --ds-border-neutral-quiet: rgba(25, 29, 33, 0.1);\n  --ds-border-neutral-standard: rgba(129, 145, 158, 0.5);\n  --ds-border-brand-standard: rgba(0, 158, 170, 0.95);\n  --ds-border-danger-standard: rgba(245, 88, 112, 0.95);\n  --ds-border-positive-standard: rgba(26, 162, 122, 0.95);\n  --ds-border-warning-standard: rgba(219, 116, 22, 0.95);\n\n  /* Oddity */\n  --ds-focus: rgb(12, 125, 140);\n  --ds-overlay: rgba(33, 37, 41, 0.24);\n  --ds-oddity-brand: rgb(9, 54, 63);\n  --ds-password-digits: rgb(0, 112, 191);\n  --ds-password-symbols: rgb(178, 87, 41);\n\n  /* Chart palette (base shades) */\n  --ds-chart-aquamarine: rgb(83, 163, 162);\n  --ds-chart-cherry: rgb(237, 109, 100);\n  --ds-chart-indigo: rgb(136, 143, 235);\n  --ds-chart-magenta: rgb(222, 104, 204);\n  --ds-chart-moss: rgb(150, 153, 98);\n  --ds-chart-ochre: rgb(199, 137, 56);\n\n  /* --- Radii (Dashlane uses tight 4px) --- */\n  --ds-radius-xs: 2px;\n  --ds-radius-sm: 4px;     /* buttons, inputs */\n  --ds-radius-md: 8px;     /* cards */\n  --ds-radius-lg: 12px;    /* dialogs */\n  --ds-radius-pill: 999px;\n\n  /* --- Spacing scale (4px base) --- */\n  --ds-space-1: 4px;\n  --ds-space-2: 8px;\n  --ds-space-3: 12px;\n  --ds-space-4: 16px;\n  --ds-space-5: 24px;\n  --ds-space-6: 32px;\n  --ds-space-7: 48px;\n  --ds-space-8: 64px;\n\n  /* --- Elevation / shadows (subtle, short-distance) --- */\n  --ds-shadow-sm: 0 1px 2px rgba(137, 138, 141, 0.16);\n  --ds-shadow-md: 0 2px 8px rgba(137, 138, 141, 0.18), 0 1px 2px rgba(0,0,0,0.06);\n  --ds-shadow-lg: 0 8px 24px rgba(137, 138, 141, 0.24), 0 2px 6px rgba(0,0,0,0.08);\n  --ds-shadow-dialog: 0 16px 48px rgba(0, 0, 0, 0.24);\n\n  /* --- Motion --- */\n  --ds-ease: cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n  --ds-duration-fast: 150ms; /* @kind other */\n  --ds-duration-med: 220ms; /* @kind other */\n}\n\n/* Dark theme — opt in with [data-theme=\"dark\"] */\n[data-theme='dark'] {\n  --ds-background-default: rgb(25, 29, 33);\n  --ds-background-alternate: rgb(25, 29, 33);\n  --ds-container-neutral-quiet: rgb(27, 32, 36);\n  --ds-container-neutral-standard: rgb(36, 42, 46);\n  --ds-container-neutral-supershy: rgb(33, 37, 41);\n  --ds-container-inverse-standard: rgb(36, 42, 46);\n  --ds-text-neutral-catchy: rgb(246, 249, 250);\n  --ds-text-neutral-standard: rgba(241, 244, 246, 0.9);\n  --ds-text-neutral-quiet: rgba(150, 167, 176, 0.85);\n  --ds-text-brand-standard: rgb(122, 199, 207);\n  --ds-text-brand-quiet: rgb(0, 158, 170);\n  --ds-border-neutral-quiet: rgba(246, 249, 250, 0.1);\n  --ds-border-neutral-standard: rgba(98, 114, 128, 0.5);\n  --ds-overlay: rgba(25, 29, 33, 0.86);\n}\n\n/* ==================================================================\n   TYPOGRAPHY — semantic classes matching DS tokens\n   ================================================================== */\n\nbody {\n  font-family: var(--ds-font-body);\n  color: var(--ds-text-neutral-standard);\n  background: var(--ds-background-default);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n/* ds.specialty.brand — GT Walsheim Pro, display */\n.ds-specialty-brand-large {\n  font-family: var(--ds-font-heading);\n  font-weight: 500;\n  font-size: 110px;\n  line-height: 110px;\n  letter-spacing: -0.02em;\n}\n.ds-specialty-brand-medium {\n  font-family: var(--ds-font-heading);\n  font-weight: 500;\n  font-size: 64px;\n  line-height: 64px;\n  letter-spacing: -0.02em;\n}\n.ds-specialty-brand-small {\n  font-family: var(--ds-font-heading);\n  font-weight: 500;\n  font-size: 44px;\n  line-height: 44px;\n  letter-spacing: -0.02em;\n}\n\n/* ds.specialty.monospace */\n.ds-specialty-mono-large {\n  font-family: var(--ds-font-mono);\n  font-weight: 400;\n  font-size: 64px;\n  line-height: 64px;\n  letter-spacing: -0.03em;\n}\n.ds-specialty-mono-medium {\n  font-family: var(--ds-font-mono);\n  font-weight: 400;\n  font-size: 37px;\n  line-height: 42px;\n  letter-spacing: -0.03em;\n}\n.ds-specialty-mono-small {\n  font-family: var(--ds-font-mono);\n  font-weight: 400;\n  font-size: 26px;\n  line-height: 30px;\n  letter-spacing: -0.03em;\n}\n\n/* ds.specialty.spotlight */\n.ds-specialty-spotlight-large { font-family: var(--ds-font-body); font-weight: 400; font-size: 64px; line-height: 64px; }\n.ds-specialty-spotlight-medium { font-family: var(--ds-font-body); font-weight: 400; font-size: 37px; line-height: 42px; }\n.ds-specialty-spotlight-small { font-family: var(--ds-font-body); font-weight: 400; font-size: 26px; line-height: 30px; }\n\n/* ds.title */\n.ds-title-section-large  { font-family: var(--ds-font-body); font-weight: 500; font-size: 31px; line-height: 36px; letter-spacing: -0.02em; }\n.ds-title-section-medium { font-family: var(--ds-font-body); font-weight: 500; font-size: 22px; line-height: 28px; letter-spacing: -0.01em; }\n.ds-title-block-medium   { font-family: var(--ds-font-body); font-weight: 500; font-size: 16px; line-height: 20px; }\n.ds-title-block-small    { font-family: var(--ds-font-body); font-weight: 500; font-size: 14px; line-height: 18px; }\n.ds-title-supporting-small {\n  font-family: var(--ds-font-body);\n  font-weight: 500;\n  font-size: 11px;\n  line-height: 12px;\n  letter-spacing: 0.03em;\n  text-transform: uppercase;\n}\n\n/* ds.body */\n.ds-body-standard-regular { font-family: var(--ds-font-body); font-weight: 400; font-size: 15px; line-height: 20px; }\n.ds-body-standard-strong  { font-family: var(--ds-font-body); font-weight: 600; font-size: 15px; line-height: 20px; }\n.ds-body-standard-link    { font-family: var(--ds-font-body); font-weight: 400; font-size: 15px; line-height: 20px; text-decoration: underline; }\n.ds-body-standard-mono    { font-family: var(--ds-font-mono); font-weight: 400; font-size: 15px; line-height: 20px; letter-spacing: -0.02em; }\n.ds-body-reduced-regular  { font-family: var(--ds-font-body); font-weight: 400; font-size: 13px; line-height: 18px; }\n.ds-body-reduced-strong   { font-family: var(--ds-font-body); font-weight: 600; font-size: 13px; line-height: 18px; }\n.ds-body-reduced-mono     { font-family: var(--ds-font-mono); font-weight: 400; font-size: 13px; line-height: 18px; letter-spacing: -0.02em; }\n.ds-body-helper-regular   { font-family: var(--ds-font-body); font-weight: 400; font-size: 11px; line-height: 12px; }\n\n/* ds.component */\n.ds-component-button-standard { font-family: var(--ds-font-body); font-weight: 500; font-size: 15px; line-height: 18px; }\n.ds-component-button-small    { font-family: var(--ds-font-body); font-weight: 500; font-size: 13px; line-height: 14px; }\n.ds-component-link-standard   { font-family: var(--ds-font-body); font-weight: 500; font-size: 15px; line-height: 18px; }\n.ds-component-link-reduced    { font-family: var(--ds-font-body); font-weight: 500; font-size: 13px; line-height: 14px; }\n.ds-component-badge-standard {\n  font-family: var(--ds-font-body);\n  font-weight: 500;\n  font-size: 10px;\n  line-height: 10px;\n  letter-spacing: 0.03em;\n  text-transform: uppercase;\n}\n<\u002Fstyle>\n<script src=\"e50ff829-2273-4808-81bd-1c6ea467ee7f\"><\u002Fscript>\n<style>html,body{margin:0;background:rgb(246,249,250)}a{color:rgb(12,125,140)}a:hover{color:rgb(2,98,114)}textarea:focus,input:focus{outline:2px solid rgb(12,125,140);outline-offset:3px}<\u002Fstyle>\n\n<\u002Fhelmet>\n<div style=\"min-height:100vh; display:grid; grid-template-columns:240px minmax(0,1fr); font-family:var(--ds-font-body); color:var(--ds-text-neutral-catchy); background:var(--ds-background-alternate);\">\n  <aside style=\"background:var(--ds-background-default); border-right:1px solid rgba(129,145,158,0.5); padding:24px 16px; display:flex; flex-direction:column; gap:16px;\">\n    <div style=\"display:flex; flex-direction:column; gap:4px; padding:0 8px;\">\n      <div style=\"font-family:var(--ds-font-heading); font-weight:500; font-size:22px; letter-spacing:-0.01em;\">Teleprompter<\u002Fdiv>\n      <div style=\"font-size:13px; color:var(--ds-text-neutral-quiet);\">Scripts are saved in this browser<\u002Fdiv>\n    <\u002Fdiv>\n    <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Button\" intensity=\"quiet\" fullsize=\"{{ true }}\" sc-camel-on-click=\"{{ newScript }}\" hint-size=\"100%,40px\">New script<\u002Fx-import>\n    <div style=\"display:flex; flex-direction:column; gap:2px;\">\n      <div style=\"font-size:12px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--ds-text-neutral-quiet); padding:8px 8px 4px;\">Scripts<\u002Fdiv>\n      <sc-for list=\"{{ scriptList }}\" as=\"s\" hint-placeholder-count=\"2\">\n        <button sc-camel-on-click=\"{{ s.select }}\" style=\"all:unset; cursor:pointer; display:flex; flex-direction:column; gap:2px; padding:10px 12px; border-radius:4px; background:{{ s.bg }}; transition:background 180ms cubic-bezier(0.2,0,0,1);\" style-hover=\"background:rgba(12,125,140,0.08)\">\n          <span style=\"font-size:14px; font-weight:{{ s.weight }}; color:{{ s.color }}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ s.title }}<\u002Fspan>\n          <span style=\"font-size:12px; color:var(--ds-text-neutral-quiet);\">{{ s.meta }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"padding:32px; display:flex; flex-direction:column; gap:24px; min-width:0;\">\n    <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:16px;\">\n      <input value=\"{{ title }}\" sc-camel-on-change=\"{{ onTitle }}\" placeholder=\"Untitled script\" aria-label=\"Script title\" style=\"flex:1 1 280px; min-width:0; font-family:var(--ds-font-body); font-size:28px; font-weight:600; letter-spacing:-0.01em; color:var(--ds-text-neutral-catchy); background:transparent; border:1px solid transparent; border-radius:4px; padding:4px 8px; margin-left:-8px;\" style-hover=\"border-color:rgba(129,145,158,0.5)\">\n      <div style=\"display:flex; gap:8px; align-items:center;\">\n        <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Button\" mood=\"danger\" intensity=\"supershy\" sc-camel-on-click=\"{{ deleteScript }}\" disabled=\"{{ cantDelete }}\" hint-size=\"80px,40px\">Delete<\u002Fx-import>\n        <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Button\" size=\"large\" sc-camel-on-click=\"{{ present }}\" hint-size=\"120px,48px\">Present<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; align-items:start;\">\n      <section style=\"grid-column:span 2; min-width:0; background:var(--ds-background-default); border:1px solid rgba(129,145,158,0.5); border-radius:8px; box-shadow:var(--ds-shadow-sm); display:flex; flex-direction:column;\">\n        <div style=\"padding:16px 20px; border-bottom:1px solid rgba(129,145,158,0.5); display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:baseline;\">\n          <div style=\"font-size:16px; font-weight:600;\">Script<\u002Fdiv>\n          <div style=\"font-size:13px; color:var(--ds-text-neutral-quiet);\">{{ stats }}<\u002Fdiv>\n        <\u002Fdiv>\n        <textarea value=\"{{ text }}\" sc-camel-on-change=\"{{ onText }}\" spellcheck=\"true\" placeholder=\"Aochen: Wait a minute…\" style=\"min-height:520px; resize:vertical; border:none; padding:20px; font-family:var(--ds-font-mono); font-size:14px; line-height:1.7; color:var(--ds-text-neutral-catchy); background:transparent; border-radius:0 0 8px 8px;\"><\u002Ftextarea>\n        <div style=\"padding:16px 20px; border-top:1px solid rgba(129,145,158,0.5); background:var(--ds-background-alternate); border-radius:0 0 8px 8px; display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; font-size:13px; color:var(--ds-text-neutral-quiet);\">\n          <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-family:var(--ds-font-mono); color:var(--ds-text-neutral-catchy);\">Name: Line<\u002Fspan><span>Spoken line, colored by speaker<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-family:var(--ds-font-mono); color:var(--ds-text-neutral-catchy);\">[Stage direction] …<\u002Fspan><span>Shown in grey as a direction<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:2px;\"><span style=\"font-family:var(--ds-font-mono); color:var(--ds-text-neutral-catchy);\">Name: (Gasps) Line<\u002Fspan><span>Cue in italics before the line<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <div style=\"display:flex; flex-direction:column; gap:24px; min-width:0;\">\n        <section style=\"background:var(--ds-background-default); border:1px solid rgba(129,145,158,0.5); border-radius:8px; box-shadow:var(--ds-shadow-sm); padding:20px; display:flex; flex-direction:column; gap:20px;\">\n          <div style=\"font-size:16px; font-weight:600;\">Appearance<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px;\">\n            <div style=\"font-size:14px; font-weight:500;\">Background<\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:8px;\">\n              <sc-for list=\"{{ bgOptions }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ b.pick }}\" style=\"all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:center; font-size:13px; color:var(--ds-text-neutral-standard);\">\n                  <span style=\"width:100%; height:40px; border-radius:4px; background:{{ b.swatch }}; border:1px solid rgba(129,145,158,0.5); outline:{{ b.ring }}; outline-offset:2px; box-sizing:border-box;\"><\u002Fspan>\n                  {{ b.label }}\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Slider\" label=\"Text size\" min=\"{{ sizeMin }}\" max=\"{{ sizeMax }}\" step=\"{{ sizeStep }}\" value=\"{{ size }}\" sc-camel-on-change=\"{{ onSize }}\" show-value=\"{{ true }}\" hint-size=\"100%,56px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Toggle\" label=\"Show upcoming line\" description=\"Dimmed preview of what comes next\" checked=\"{{ showNext }}\" sc-camel-on-change=\"{{ onShowNext }}\" hint-size=\"100%,44px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"DashlaneDesignSystem_91348a.Toggle\" label=\"Mirror text\" description=\"For reflective teleprompter glass\" checked=\"{{ mirror }}\" sc-camel-on-change=\"{{ onMirror }}\" hint-size=\"100%,44px\"><\u002Fx-import>\n        <\u002Fsection>\n\n        <section style=\"background:var(--ds-background-default); border:1px solid rgba(129,145,158,0.5); border-radius:8px; box-shadow:var(--ds-shadow-sm); padding:20px; display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; flex-direction:column; gap:4px;\">\n            <div style=\"font-size:16px; font-weight:600;\">Speaker colors<\u002Fdiv>\n            <div style=\"font-size:13px; color:var(--ds-text-neutral-quiet);\">Detected from your script<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noSpeakers }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:14px; color:var(--ds-text-neutral-quiet);\">Add lines like “Name: Line” to assign colors.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{ speakers }}\" as=\"sp\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex; flex-direction:column; gap:8px;\">\n              <div style=\"font-size:14px; font-weight:500;\">{{ sp.name }}<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n                <sc-for list=\"{{ sp.swatches }}\" as=\"sw\" hint-placeholder-count=\"7\">\n                  <button sc-camel-on-click=\"{{ sw.pick }}\" title=\"{{ sw.label }}\" aria-label=\"{{ sw.label }}\" style=\"all:unset; cursor:pointer; width:28px; height:28px; border-radius:4px; background:{{ sw.color }}; border:1px solid rgba(129,145,158,0.5); outline:{{ sw.ring }}; outline-offset:2px; box-sizing:border-box;\"><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section style=\"border-radius:8px; overflow:hidden; border:1px solid rgba(129,145,158,0.5); display:flex; flex-direction:column;\">\n          <div style=\"background:var(--ds-background-default); padding:12px 20px; font-size:13px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--ds-text-neutral-quiet);\">Preview<\u002Fdiv>\n          <div style=\"background:{{ bgColor }}; padding:20px; display:flex; flex-direction:column; gap:14px; transform:{{ mirrorT }};\">\n            <sc-for list=\"{{ previewItems }}\" as=\"l\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; flex-direction:column; gap:4px;\">\n                <sc-if value=\"{{ l.speaker }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:{{ l.color }};\">{{ l.speaker }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-size:17px; line-height:1.3; font-weight:{{ l.weight }}; font-style:{{ l.fstyle }}; color:{{ l.color }};\"><sc-if value=\"{{ l.cue }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-style:italic; font-weight:400; color:{{ dirColor }};\">{{ l.cue }} <\u002Fspan><\u002Fsc-if>{{ l.text }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ presenting }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:10; background:{{ bgColor }}; overflow:hidden;\">\n      <div sc-camel-on-click=\"{{ next }}\" style=\"position:absolute; inset:0; cursor:pointer; user-select:none; transform:{{ mirrorT }};\">\n        <div style=\"position:absolute; left:0; right:0; top:42%; display:flex; justify-content:space-between; pointer-events:none;\">\n          <div style=\"width:28px; height:4px; background:rgb(0,158,170); border-radius:2px;\"><\u002Fdiv>\n          <div style=\"width:28px; height:4px; background:rgb(0,158,170); border-radius:2px;\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div ref=\"{{ colRef }}\" style=\"position:absolute; left:0; right:0; top:0; padding:0 6vw; display:flex; flex-direction:column; gap:0.75em; transition:transform 420ms cubic-bezier(0.2,0,0,1); font-size:{{ sizePx }};\">\n          <sc-for list=\"{{ items }}\" as=\"l\" hint-placeholder-count=\"4\">\n            <div data-line=\"1\" style=\"display:flex; flex-direction:column; gap:0.15em; max-width:1600px; opacity:{{ l.opacity }}; transition:opacity 300ms cubic-bezier(0.2,0,0,1);\">\n              <sc-if value=\"{{ l.isDir }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:0.55em; line-height:1.3; font-style:italic; color:{{ dirColor }}; border-top:1px solid rgba(129,145,158,0.5); border-bottom:1px solid rgba(129,145,158,0.5); padding:0.4em 0;\">\n                  <div style=\"font-size:0.6em; font-style:normal; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:0.2em;\">Stage direction<\u002Fdiv>\n                  {{ l.text }}\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ l.isLine }}\" hint-placeholder-val=\"{{ true }}\">\n                <sc-if value=\"{{ l.speaker }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-size:0.5em; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:{{ l.color }};\">{{ l.speaker }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-weight:500; line-height:1.2; letter-spacing:-0.01em; text-wrap:pretty; color:{{ l.color }};\"><sc-if value=\"{{ l.cue }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-style:italic; font-weight:400; color:{{ dirColor }};\">{{ l.cue }} <\u002Fspan><\u002Fsc-if>{{ l.text }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:absolute; left:20px; right:20px; top:16px; display:flex; justify-content:space-between; align-items:center; gap:16px; font-size:14px; color:{{ dirColor }};\">\n        <button sc-camel-on-click=\"{{ exit }}\" style=\"all:unset; cursor:pointer; padding:8px 12px; border-radius:4px; border:1px solid rgba(129,145,158,0.5);\" style-hover=\"background:rgba(129,145,158,0.2)\">Exit · Esc<\u002Fbutton>\n        <span>{{ counter }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:absolute; left:0; bottom:0; height:3px; width:{{ progress }}; background:rgb(0,158,170); transition:width 300ms cubic-bezier(0.2,0,0,1);\"><\u002Fdiv>\n      <div style=\"position:absolute; right:20px; bottom:16px; font-size:13px; color:{{ dirColor }};\">Space, click, or clicker: next · ←: back · Home: restart<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'teleprompter-app-v1';\nconst SEED = `[Stage Direction] Aochen and Hans walk on stage. Aochen looks closely at a map. Hans waves happily at the crowd.\n\nAochen: Wait a minute… Hans, this is not the International Seafood Festival.\nHans: What do you mean? Look at this crowd! They look hungry. They want to eat us!\nAochen: No, look at the screen! It says “DashHack 2026”. We’re two lobsters at a hackathon!\nHans: (Gasps) Oh no! And there are already more than 20 projects registered!\nAochen: More than 20?! What are they building? New ways to cook lobster?!\nHans: Worse. Tech projects!\nAochen: Worse?\nHans: Yes! They’re engineers. They can build anything!\nAochen: Right! Pretend we know about tech. Say some computer words!\nHans: (Pointing claws at the crowd) Uh… AI! Wi-Fi! Passwords! Please don’t boil us!\nAochen: They’re not buying it! We need someone who actually knows what happened at DashHack!\nHans: Ivo, save us! Tell them about the great things they built in 2025!\n\n[Stage Direction] Both Aochen and Hans quickly run off the stage sideways, clicking their claws. Ivo continues with the 2025 achievements.`;\nconst PALETTE = [\n  { label: 'Blue', dark: 'rgb(150,200,255)', light: 'rgb(20,90,170)' },\n  { label: 'Orange', dark: 'rgb(255,190,140)', light: 'rgb(170,80,20)' },\n  { label: 'Green', dark: 'rgb(150,225,180)', light: 'rgb(10,115,70)' },\n  { label: 'Purple', dark: 'rgb(205,180,255)', light: 'rgb(105,60,180)' },\n  { label: 'Yellow', dark: 'rgb(250,225,140)', light: 'rgb(130,95,0)' },\n  { label: 'Pink', dark: 'rgb(255,170,190)', light: 'rgb(175,35,75)' },\n  { label: 'White', dark: 'rgb(246,249,250)', light: 'rgb(33,37,41)' }\n];\nconst BGS = { dark: { label: 'Dark', c: 'rgb(25,29,33)' }, black: { label: 'Black', c: 'rgb(0,0,0)' }, light: { label: 'Light', c: 'rgb(255,255,255)' } };\nconst uid = () => Math.random().toString(36).slice(2, 9);\nconst unquote = s => s.trim().replace(/^[\"“”']+|[\"“”']+$/g, '').trim();\n\nfunction parse(text) {\n  const out = [];\n  for (let raw of (text || '').split('\\n')) {\n    const t = raw.trim();\n    if (!t) continue;\n    let m = t.match(/^\\[([^\\]]*)\\]\\s*(.*)$/);\n    if (m) { const body = /stage\\s*direction/i.test(m[1]) ? m[2] : (m[2] ? m[1] + ' ' + m[2] : m[1]); out.push({ type: 'dir', text: unquote(body) }); continue; }\n    if (/^\\(.*\\)$/.test(t)) { out.push({ type: 'dir', text: t.slice(1, -1) }); continue; }\n    m = t.match(/^([^:\"“\\[\\(]{1,30}):\\s*(.*)$/);\n    let speaker = '', body = t;\n    if (m) { speaker = m[1].trim(); body = m[2]; }\n    let cue = '';\n    const c = body.match(/^\\s*(\\([^)]*\\))\\s*(.*)$/);\n    if (c) { cue = c[1]; body = c[2]; }\n    out.push({ type: 'line', speaker, cue, text: unquote(body) });\n  }\n  return out;\n}\n\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    let saved = null;\n    try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}\n    const first = { id: uid(), title: 'Lobsters at DashHack', text: SEED, updated: Date.now() };\n    this.state = Object.assign({\n      scripts: [first], activeId: first.id,\n      settings: { size: 72, bg: 'dark', mirror: false, showNext: true },\n      colors: { Aochen: 0, Hans: 1 }, positions: {}, presenting: false\n    }, saved || {}, { presenting: false });\n  }\n  colRef = React.createRef();\n  componentDidMount() { window.addEventListener('keydown', this.onKey); window.addEventListener('resize', this.align); }\n  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.align); }\n  componentDidUpdate(_, prev) {\n    const { presenting, ...rest } = this.state;\n    localStorage.setItem(KEY, JSON.stringify(rest));\n    if (presenting) { this.align(); if (!prev.presenting) setTimeout(this.align, 80); }\n  }\n  active() { return this.state.scripts.find(s => s.id === this.state.activeId) || this.state.scripts[0]; }\n  pos() { return this.state.positions[this.active().id] || 0; }\n  updateActive(patch) {\n    const id = this.active().id;\n    this.setState(s => ({ scripts: s.scripts.map(x => x.id === id ? { ...x, ...patch, updated: Date.now() } : x) }));\n  }\n  setSetting(k, v) { this.setState(s => ({ settings: { ...s.settings, [k]: v } })); }\n  go = (d) => {\n    const n = parse(this.active().text).length, id = this.active().id;\n    this.setState(s => ({ positions: { ...s.positions, [id]: Math.max(0, Math.min(n - 1, (s.positions[id] || 0) + d)) } }));\n  };\n  setPos = (v) => { const id = this.active().id; this.setState(s => ({ positions: { ...s.positions, [id]: v } })); };\n  onKey = (e) => {\n    if (!this.state.presenting) return;\n    if ([' ', 'ArrowDown', 'ArrowRight', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); this.go(1); }\n    else if (['ArrowUp', 'ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); this.go(-1); }\n    else if (e.key === 'Home') this.setPos(0);\n    else if (e.key === 'Escape') this.setState({ presenting: false });\n  };\n  align = () => {\n    const col = this.colRef.current; if (!col) return;\n    const el = col.querySelectorAll('[data-line]')[this.pos()]; if (!el) return;\n    col.style.transform = `translateY(${window.innerHeight * 0.42 - el.offsetTop - el.offsetHeight * 0.25}px)`;\n  };\n  colorIdx(name, speakers) {\n    const c = this.state.colors;\n    if (c[name] != null) return c[name];\n    const used = new Set(Object.values(c));\n    const free = [...PALETTE.keys()].filter(i => !used.has(i));\n    return free[speakers.indexOf(name) % Math.max(free.length, 1)] ?? speakers.indexOf(name) % PALETTE.length;\n  }\n  renderVals() {\n    const { scripts, settings, presenting } = this.state;\n    const a = this.active();\n    const parsed = parse(a.text);\n    const tone = settings.bg === 'light' ? 'light' : 'dark';\n    const dirColor = tone === 'light' ? 'rgb(74,91,105)' : 'rgba(150,167,176,0.95)';\n    const neutral = tone === 'light' ? 'rgb(33,37,41)' : 'rgb(246,249,250)';\n    const speakerNames = [...new Set(parsed.filter(p => p.speaker).map(p => p.speaker))];\n    const colorOf = n => n ? PALETTE[this.colorIdx(n, speakerNames)][tone] : neutral;\n    const i = Math.min(this.pos(), Math.max(parsed.length - 1, 0));\n    const decorate = (p, k) => ({\n      ...p, isDir: p.type === 'dir', isLine: p.type === 'line',\n      color: p.type === 'dir' ? dirColor : colorOf(p.speaker),\n      weight: p.type === 'dir' ? 400 : 500, fstyle: p.type === 'dir' ? 'italic' : 'normal',\n      opacity: k === i ? 1 : (k === i + 1 && settings.showNext ? 0.45 : (k < i ? 0.18 : (settings.showNext ? 0.18 : 0)))\n    });\n    const lineCount = parsed.filter(p => p.type === 'line').length;\n    return {\n      scriptList: [...scripts].sort((x, y) => y.updated - x.updated).map(s => ({\n        title: s.title || 'Untitled script',\n        meta: `${parse(s.text).filter(p => p.type === 'line').length} lines`,\n        bg: s.id === a.id ? 'rgba(12,125,140,0.12)' : 'transparent',\n        color: s.id === a.id ? 'rgb(2,98,114)' : 'rgba(42,49,56,0.92)',\n        weight: s.id === a.id ? 600 : 400,\n        select: () => this.setState({ activeId: s.id })\n      })),\n      newScript: () => { const s = { id: uid(), title: '', text: '', updated: Date.now() }; this.setState(st => ({ scripts: [...st.scripts, s], activeId: s.id })); },\n      deleteScript: () => {\n        if (scripts.length < 2 || !confirm(`Delete “${a.title || 'Untitled script'}”?`)) return;\n        const rest = scripts.filter(s => s.id !== a.id);\n        this.setState({ scripts: rest, activeId: rest[0].id });\n      },\n      cantDelete: scripts.length < 2,\n      title: a.title, onTitle: e => this.updateActive({ title: e.target.value }),\n      text: a.text, onText: e => this.updateActive({ text: e.target.value }),\n      stats: `${lineCount} lines · ${speakerNames.length} speakers · ${parsed.length - lineCount} directions`,\n      present: () => { if (parsed.length) this.setState({ presenting: true }); },\n      exit: (e) => { e.stopPropagation(); this.setState({ presenting: false }); },\n      bgOptions: Object.entries(BGS).map(([k, b]) => ({ label: b.label, swatch: b.c, ring: settings.bg === k ? '2px solid rgb(12,125,140)' : 'none', pick: () => this.setSetting('bg', k) })),\n      size: settings.size, sizeMin: 40, sizeMax: 160, sizeStep: 4,\n      onSize: e => this.setSetting('size', +e.target.value),\n      showNext: settings.showNext, onShowNext: e => this.setSetting('showNext', e.target.checked),\n      mirror: settings.mirror, onMirror: e => this.setSetting('mirror', e.target.checked),\n      noSpeakers: speakerNames.length === 0,\n      speakers: speakerNames.map(n => {\n        const cur = this.colorIdx(n, speakerNames);\n        return { name: n, swatches: PALETTE.map((p, pi) => ({\n          label: p.label, color: p[tone],\n          ring: pi === cur ? '2px solid rgb(12,125,140)' : 'none',\n          pick: () => this.setState(s => ({ colors: { ...s.colors, [n]: pi } }))\n        })) };\n      }),\n      bgColor: BGS[settings.bg].c, dirColor,\n      mirrorT: settings.mirror ? 'scaleX(-1)' : 'none',\n      previewItems: parsed.slice(0, 4).map(decorate),\n      presenting, colRef: this.colRef, next: () => this.go(1),\n      items: parsed.map(decorate),\n      sizePx: settings.size + 'px',\n      counter: `${i + 1} / ${parsed.length}`,\n      progress: parsed.length ? `${((i + 1) / parsed.length) * 100}%` : '0%'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
