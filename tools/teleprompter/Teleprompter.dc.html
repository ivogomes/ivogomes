<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/dashlane-product-91348af6-b46c-49b4-8289-059194cd2eaf/colors_and_type.css">
<script src="_ds/dashlane-product-91348af6-b46c-49b4-8289-059194cd2eaf/_ds_bundle.js"></script>
<style>html,body{margin:0;background:rgb(25,29,33);overflow:hidden}a{color:rgb(50,169,178)}a:hover{color:rgb(120,200,205)}</style>
</helmet>
<div onClick="{{ next }}" style="position:fixed; inset:0; background:rgb(25,29,33); color:rgb(246,249,250); font-family:var(--ds-font-body); cursor:pointer; user-select:none; overflow:hidden; transform:{{ mirror }};">
  <div style="position:absolute; left:0; right:0; top:42%; height:4px; pointer-events:none; display:flex; justify-content:space-between;">
    <div style="width:28px; height:4px; background:rgb(50,169,178); border-radius:2px;"></div>
    <div style="width:28px; height:4px; background:rgb(50,169,178); border-radius:2px;"></div>
  </div>
  <div ref="{{ colRef }}" style="position:absolute; left:0; right:0; top:0; padding:0 6vw; display:flex; flex-direction:column; gap:56px; transition:transform 420ms cubic-bezier(0.2,0,0,1); font-size:{{ size }};">
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="6">
      <div data-line="1" style="display:flex; flex-direction:column; gap:12px; opacity:{{ l.opacity }}; transition:opacity 300ms cubic-bezier(0.2,0,0,1); max-width:1600px;">
        <sc-if value="{{ l.isDir }}" hint-placeholder-val="{{ false }}">
          <div style="font-size:0.55em; line-height:1.3; font-style:italic; color:rgba(150,167,176,0.95); border-top:1px solid rgba(129,145,158,0.5); border-bottom:1px solid rgba(129,145,158,0.5); padding:24px 0;">
            <div style="font-size:0.6em; font-style:normal; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:8px;">Stage direction</div>
            {{ l.text }}
          </div>
        </sc-if>
        <sc-if value="{{ l.isLine }}" hint-placeholder-val="{{ true }}">
          <div style="font-size:0.5em; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:{{ l.color }};">{{ l.speaker }}</div>
          <div style="font-weight:500; line-height:1.2; letter-spacing:-0.01em; text-wrap:pretty; color:{{ l.color }};">
            <sc-if value="{{ l.cue }}" hint-placeholder-val="{{ false }}"><span style="font-style:italic; font-weight:400; color:rgba(150,167,176,0.95);">{{ l.cue }} </span></sc-if>{{ l.text }}
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute; right:24px; bottom:20px; font-size:16px; color:rgba(150,167,176,0.95); display:flex; gap:16px;">
    <span>{{ counter }}</span><span>Space or click: next · ←: back · Home: restart</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;textSize&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:76,&quot;min&quot;:40,&quot;max&quot;:140,&quot;step&quot;:4,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;mirror&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const SCRIPT = [
  ['DIR', 'Aochen and Hans walk on stage. Aochen looks closely at a map. Hans waves happily at the crowd.'],
  ['Aochen', 'Wait a minute… Hans, this is not the International Seafood Festival.'],
  ['Hans', 'What do you mean? Look at this crowd! They look hungry. They want to eat us!'],
  ['Aochen', 'No, look at the screen! It says “DashHack 2026”. We’re two lobsters at a hackathon!'],
  ['Hans', 'Oh no! And there are already more than 20 projects registered!', '(Gasps)'],
  ['Aochen', 'More than 20?! What are they building? New ways to cook lobster?!'],
  ['Hans', 'Worse. Tech projects!'],
  ['Aochen', 'Worse?'],
  ['Hans', 'Yes! They’re engineers. They can build anything!'],
  ['Aochen', 'Right! Pretend we know about tech. Say some computer words!'],
  ['Hans', 'Uh… AI! Wi-Fi! Passwords! Please don’t boil us!', '(Pointing claws at the crowd)'],
  ['Aochen', 'They’re not buying it! We need someone who actually knows what happened at DashHack!'],
  ['Hans', 'Ivo, save us! Tell them about the great things they built in 2025!'],
  ['DIR', 'Both Aochen and Hans quickly run off the stage sideways, clicking their claws. Ivo continues with the 2025 achievements.']
];
const COLORS = { Aochen: 'rgb(150,200,255)', Hans: 'rgb(255,190,140)' };
const KEY = 'dashhack-teleprompter-idx';
class Component extends DCLogic {
  state = { i: Math.min(+(localStorage.getItem(KEY) || 0), SCRIPT.length - 1) };
  colRef = React.createRef();
  go = (d) => this.setState(s => ({ i: Math.max(0, Math.min(SCRIPT.length - 1, s.i + d)) }));
  onKey = (e) => {
    if ([' ', 'ArrowDown', 'ArrowRight', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); this.go(1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); this.go(-1); }
    else if (e.key === 'Home') this.setState({ i: 0 });
  };
  componentDidMount() { window.addEventListener('keydown', this.onKey); window.addEventListener('resize', this.align); setTimeout(this.align, 50); setTimeout(this.align, 600); }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); window.removeEventListener('resize', this.align); }
  componentDidUpdate() { localStorage.setItem(KEY, this.state.i); this.align(); }
  align = () => {
    const col = this.colRef.current; if (!col) return;
    const el = col.querySelectorAll('[data-line]')[this.state.i]; if (!el) return;
    col.style.transform = `translateY(${window.innerHeight * 0.42 - el.offsetTop - 30}px)`;
  };
  renderVals() {
    const i = this.state.i;
    return {
      colRef: this.colRef,
      next: () => this.go(1),
      size: (this.props.textSize ?? 72) + 'px',
      mirror: this.props.mirror ? 'scaleX(-1)' : 'none',
      counter: `${i + 1} / ${SCRIPT.length}`,
      lines: SCRIPT.map(([sp, text, cue], k) => ({
        isDir: sp === 'DIR', isLine: sp !== 'DIR', speaker: sp, text, cue: cue || '',
        color: COLORS[sp], opacity: k === i ? 1 : (k === i + 1 ? 0.45 : 0.18)
      }))
    };
  }
}
</script>
</body>
</html>
